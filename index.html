<html lang="en">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00040f" />

    <title>Kedar Ghadyalji</title>
    <meta
      name="description"
      content="Portfolio of Kedar Ghadyalji, a software engineer building high-performance systems where architectural integrity meets seamless user experience."
    />

    <!-- Open Graph (link previews on Slack, Discord, LinkedIn, etc.) -->
    <!-- og:image is relative for now; swap in an absolute URL (e.g.
         https://yourdomain.com/Kedar.png) once you know the production
         domain — some crawlers require an absolute path to render previews. -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Kedar Ghadyalji"
    />
    <meta
      property="og:description"
      content="Portfolio of Kedar Ghadyalji, a software engineer building high-performance systems where architectural integrity meets seamless user experience."
    />
    <meta property="og:image" content="/Kedar.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Kedar Ghadyalji — AI Engineer & Full-Stack Developer"
    />
    <meta
      name="twitter:description"
      content="Portfolio of Kedar Ghadyalji, a software engineer building high-performance systems where architectural integrity meets seamless user experience."
    />
    <meta name="twitter:image" content="/Kedar.png" />
  </head>
